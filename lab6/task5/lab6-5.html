<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна 6 — Завдання 5. Погода</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scene">

        <!-- чорна картка -->
        <div class="card"></div>

        <!-- хмара: кілька накладених кіл із розмиттям (box-shadow) -->
        <div class="cloud">
            <div class="cloud-part cloud-part-1"></div>
            <div class="cloud-part cloud-part-2"></div>
            <div class="cloud-part cloud-part-3"></div>
            <div class="cloud-part cloud-part-4"></div>
            <div class="cloud-part cloud-part-5"></div>
        </div>

        <!-- стрілки -->
        <div class="arrows">
            <span class="arrow arrow-left">&larr;</span>
            <span class="arrow arrow-right">&rarr;</span>
        </div>

        <!-- поточна температура -->
        <div class="temp-now">17</div>

        <!-- прогноз -->
        <ul class="forecast">
            <li class="forecast-day"><span class="day">Mon</span><span class="deg">17°</span></li>
            <li class="forecast-day"><span class="day">Tue</span><span class="deg">19°</span></li>
            <li class="forecast-day"><span class="day">Wed</span><span class="deg">16°</span></li>
            <li class="forecast-day"><span class="day">Thu</span><span class="deg">18°</span></li>
            <li class="forecast-day"><span class="day">Fri</span><span class="deg">21°</span></li>
        </ul>
    </div>
</body>
</html>
