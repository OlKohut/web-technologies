<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна 6 — Завдання 6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <a class="header-link" href="#">Mail</a>
        <a class="header-link" href="#">Images</a>

        <!-- кнопка відкриття попапу: прихований checkbox лежить поверх картинки -->
        <div class="popup-wrap">
            <input class="popup-checkbox" type="checkbox" aria-label="Відкрити або закрити меню застосунків">
            <span class="popup-button"><img src="../icons/popup-button.png" alt=""></span>

            <div class="popup" tabindex="0">
                <div class="grid">
                    <a class="item" href="#"><img class="item-icon" src="../icons/mail.png" alt="">Mail</a>
                    <a class="item" href="#"><img class="item-icon" src="../icons/news.png" alt="">News</a>
                    <a class="item" href="#"><img class="item-icon" src="../icons/maps.png" alt="">Map</a>
                    <a class="item" href="#"><img class="item-icon" src="../icons/files.png" alt="">Files</a>
                    <a class="item" href="#"><img class="item-icon" src="../icons/contacts.png" alt="">Contacts</a>
                    <a class="item" href="#"><img class="item-icon" src="../icons/translation.png" alt="">Translate</a>
                    <a class="item" href="#"><img class="item-icon" src="../icons/videos.png" alt="">Videos</a>
                    <a class="item" href="#"><img class="item-icon" src="../icons/search.png" alt="">Search</a>
                    <a class="item" href="#"><img class="item-icon" src="../icons/apps.png" alt="">Apps</a>
                </div>

                <!-- додаткові іконки: з'являються після натискання More -->
                <div class="extra">
                    <div class="grid">
                        <a class="item" href="#"><img class="item-icon" src="../icons/documents.png" alt="">Documents</a>
                        <a class="item" href="#"><img class="item-icon" src="../icons/chat.png" alt="">Chat</a>
                        <a class="item" href="#"><img class="item-icon" src="../icons/classroom.png" alt="">Classroom</a>
                        <a class="item" href="#"><img class="item-icon" src="../icons/collection.png" alt="">Collection</a>
                        <a class="item" href="#"><img class="item-icon" src="../icons/mars.png" alt="">Mars</a>
                        <a class="item" href="#"><img class="item-icon" src="../icons/blogs.png" alt="">Blogs</a>
                        <a class="item" href="#"><img class="item-icon" src="../icons/promo.png" alt="">Promos</a>
                    </div>
                    <a class="even-more" href="#">Even more from Kottans</a>
                </div>

                <!-- кнопка More -->
                <div class="more">
                    <input class="more-checkbox" type="checkbox" aria-label="Показати більше іконок">
                    <span class="more-text"></span>
                </div>
            </div>
        </div>

        <a class="header-icon" href="#"><img src="../icons/bell.png" alt="Сповіщення"></a>
        <a class="avatar" href="#">K</a>
    </header>
</body>
</html>
