<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторна робота 5. Завдання 1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="plan">
      <h1 class="plan-title">План подорожі:</h1>

      <ul class="plan-list">
        <li class="plan-item">
          <span class="plan-name">Підготовчий етап</span>
          <ul class="tasks">
            <li class="tasks-item icon-route">
              <span class="tasks-name">Обрати маршрут</span>
            </li>
            <li class="tasks-item icon-ticket">
              <span class="tasks-name">Квитки на літак</span>
            </li>
            <li class="tasks-item icon-hotel">
              <span class="tasks-name">Готель</span>
            </li>
            <li class="tasks-item icon-car">
              <span class="tasks-name">Оренда авто</span>
            </li>
          </ul>
        </li>
        <li class="plan-item">
          <span class="plan-name">Відпочинок</span>
          <ul class="tasks">
            <li class="tasks-item icon-bar">
              <span class="tasks-name">Бари</span>
            </li>
            <li class="tasks-item icon-casino">
              <span class="tasks-name">Казино</span>
            </li>
            <li class="tasks-item icon-museum">
              <span class="tasks-name">Музеї</span>
            </li>
            <li class="tasks-item icon-festival">
              <span class="tasks-name">Фестивалі</span>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </body>
</html>
